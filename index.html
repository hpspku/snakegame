<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>贪吃蛇游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            touch-action: none;
        }

        h1 {
            color: #4CAF50;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .score-container {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
        }

        .score-box {
            background: rgba(76, 175, 80, 0.2);
            padding: 15px 30px;
            border-radius: 10px;
            border: 2px solid #4CAF50;
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .score-box span {
            color: #00E676;
            font-size: 1.5rem;
        }

        #gameCanvas {
            border: 3px solid #4CAF50;
            border-radius: 10px;
            background: #0a0a1a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 100%;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background: linear-gradient(145deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
            font-weight: bold;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        .direction-controls {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 10px;
            margin-top: 15px;
        }

        .dir-btn {
            background: linear-gradient(145deg, #4CAF50, #45a049);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
        }

        .dir-btn:hover {
            background: linear-gradient(145deg, #5CBF60, #4CAF50);
            transform: scale(1.1);
        }

        .dir-btn:active {
            transform: scale(0.95);
        }

        .dir-btn.up { grid-column: 2; grid-row: 1; }
        .dir-btn.left { grid-column: 1; grid-row: 2; }
        .dir-btn.down { grid-column: 2; grid-row: 2; }
        .dir-btn.right { grid-column: 3; grid-row: 2; }

        .instructions {
            color: #aaa;
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
        }

        .instructions kbd {
            background: #333;
            padding: 5px 10px;
            border-radius: 5px;
            margin: 0 3px;
        }

        .game-over-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .game-over-overlay.show {
            display: flex;
        }

        .game-over-content {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 40px 60px;
            border-radius: 20px;
            text-align: center;
            border: 3px solid #FF5252;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            from {
                transform: scale(0.5);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .game-over-content h2 {
            color: #FF5252;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .game-over-content p {
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .game-over-content .btn {
            background: linear-gradient(145deg, #FF5252, #ff6b6b);
            box-shadow: 0 4px 15px rgba(255, 82, 82, 0.4);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .score-box {
                padding: 10px 20px;
                font-size: 1rem;
            }

            .score-box span {
                font-size: 1.2rem;
            }

            .direction-controls {
                grid-template-columns: repeat(3, 50px);
                grid-template-rows: repeat(2, 50px);
            }

            .instructions {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <h1>🐍 贪吃蛇</h1>

    <div class="score-container">
        <div class="score-box">分数: <span id="score">0</span></div>
        <div class="score-box">最高分: <span id="highScore">0</span></div>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="controls">
        <button class="btn" id="startBtn">开始游戏</button>
        
        <div class="direction-controls">
            <button class="dir-btn up" data-dir="up">↑</button>
            <button class="dir-btn left" data-dir="left">←</button>
            <button class="dir-btn down" data-dir="down">↓</button>
            <button class="dir-btn right" data-dir="right">→</button>
        </div>
    </div>

    <div class="instructions">
        <p>使用 <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 方向键或点击按钮控制蛇的移动</p>
        <p>吃到食物得 1 分，撞墙或撞到自己游戏结束</p>
    </div>

    <div class="game-over-overlay" id="gameOverOverlay">
        <div class="game-over-content">
            <h2>游戏结束！</h2>
            <p>你的分数: <span id="finalScore">0</span></p>
            <button class="btn" id="restartBtn">再玩一次</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const finalScoreElement = document.getElementById('finalScore');

        const gridSize = 20;
        const canvasSize = 400;
        let snake = [];
        let food = { x: 0, y: 0 };
        let direction = 'right';
        let nextDirection = 'right';
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameLoop = null;
        let gameSpeed = 100;
        let isGameRunning = false;

        highScoreElement.textContent = highScore;

        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = 'right';
            nextDirection = 'right';
            score = 0;
            scoreElement.textContent = score;
            placeFood();
            draw();
        }

        function placeFood() {
            do {
                food = {
                    x: Math.floor(Math.random() * (canvasSize / gridSize)),
                    y: Math.floor(Math.random() * (canvasSize / gridSize))
                };
            } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
        }

        function draw() {
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, canvasSize, canvasSize);

            snake.forEach((segment, index) => {
                if (index === 0) {
                    ctx.fillStyle = '#00E676';
                } else {
                    ctx.fillStyle = '#69F0AE';
                }
                ctx.fillRect(
                    segment.x * gridSize + 1,
                    segment.y * gridSize + 1,
                    gridSize - 2,
                    gridSize - 2
                );
            });

            ctx.fillStyle = '#FF5252';
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 3,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }

        function move() {
            direction = nextDirection;
            const head = { ...snake[0] };

            switch (direction) {
                case 'up': head.y--; break;
                case 'down': head.y++; break;
                case 'left': head.x--; break;
                case 'right': head.x++; break;
            }

            if (head.x < 0 || head.x >= canvasSize / gridSize ||
                head.y < 0 || head.y >= canvasSize / gridSize ||
                snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreElement.textContent = score;
                placeFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function startGame() {
            if (isGameRunning) return;
            isGameRunning = true;
            startBtn.textContent = '游戏进行中...';
            startBtn.disabled = true;
            gameLoop = setInterval(move, gameSpeed);
        }

        function gameOver() {
            clearInterval(gameLoop);
            isGameRunning = false;
            startBtn.textContent = '开始游戏';
            startBtn.disabled = false;

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreElement.textContent = highScore;
            }

            finalScoreElement.textContent = score;
            gameOverOverlay.classList.add('show');
        }

        function restartGame() {
            gameOverOverlay.classList.remove('show');
            initGame();
        }

        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                    if (direction !== 'down') nextDirection = 'up';
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                    if (direction !== 'up') nextDirection = 'down';
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                    if (direction !== 'right') nextDirection = 'left';
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                    if (direction !== 'left') nextDirection = 'right';
                    e.preventDefault();
                    break;
                case ' ':
                    if (!isGameRunning) startGame();
                    e.preventDefault();
                    break;
            }
        });

        document.querySelectorAll('.dir-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const dir = btn.dataset.dir;
                switch (dir) {
                    case 'up':
                        if (direction !== 'down') nextDirection = 'up';
                        break;
                    case 'down':
                        if (direction !== 'up') nextDirection = 'down';
                        break;
                    case 'left':
                        if (direction !== 'right') nextDirection = 'left';
                        break;
                    case 'right':
                        if (direction !== 'left') nextDirection = 'right';
                        break;
                }
                if (!isGameRunning) startGame();
            });
        });

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', restartGame);

        initGame();
    </script>
</body>
</html>
